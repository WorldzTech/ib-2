services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - SITE_ADDRESS
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Keeps TLS certificates across rebuilds, otherwise Let's Encrypt rate limits kick in.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
